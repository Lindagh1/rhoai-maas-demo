# Cluster Observability Operator (COO) — required for the RHOAI 3.5 Tech
# Preview "Observe & Monitor → Dashboard" page (Cluster / Models / Usage tabs,
# including the MaaS usage panels). Without COO, DSCInitialization.status
# reports Ready=False with reason MissingOperator.
#
# Idempotent: `oc apply -f` is a no-op once installed.
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-cluster-observability-operator
  labels:
    app.kubernetes.io/part-of: rhoai-maas-demo
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: cluster-observability-operator
  namespace: openshift-cluster-observability-operator
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: cluster-observability-operator
  namespace: openshift-cluster-observability-operator
  labels:
    app.kubernetes.io/part-of: rhoai-maas-demo
spec:
  channel: stable
  name: cluster-observability-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
