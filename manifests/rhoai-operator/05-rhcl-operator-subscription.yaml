# NOTE: there are two RHCL Subscription manifests in this repo, used by two
# different demo flows — keep them in sync, do not delete either blindly:
#   - this file: consumed by scripts/install-rhoai-operator.sh (base RHOAI
#     install flow for the Knowledge Advisor / fraud-detection demos)
#   - manifests/platform/03-rhcl-operator-subscription.yaml: consumed by
#     scripts/10-prerequisites.sh (Demo 1 native llm-d + MaaS flow)
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhcl-operator
  namespace: openshift-operators
spec:
  channel: stable-1.4
  name: rhcl-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
