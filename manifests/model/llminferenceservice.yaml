# CPU-only, GPU-free OpenAI-compatible model simulator recommended by the
# official RHOAI MaaS companion guide for MaaS verification
# (ghcr.io/llm-d/llm-d-inference-sim -- https://github.com/llm-d/llm-d-inference-sim).
# Deterministic, fast, no real weights are used for inference (the simulator
# returns synthetic completions), so this demo never runs a real LLM/GPU/vLLM
# workload.
#
# Pointing router.gateway.refs at the shared maas-default-gateway is what
# "publishes into MaaS" means: the odh-model-controller / KServe LLMISVC
# controller watches LLMInferenceServices with a gateway ref and automatically
# creates the HTTPRoute attaching this model to the gateway.
apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: demo-simulator
  namespace: rhoai-maas-demo
  labels:
    app.kubernetes.io/part-of: rhoai-maas-demo
spec:
  model:
    uri: hf://sshleifer/tiny-gpt2
    name: facebook/opt-125m
  replicas: 1
  router:
    route: {}
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
  template:
    containers:
      - name: main
        image: "ghcr.io/llm-d/llm-d-inference-sim:v0.7.1"
        imagePullPolicy: IfNotPresent
        command: ["/app/llm-d-inference-sim"]
        args:
          - --port
          - "8000"
          - --model
          - facebook/opt-125m
          - --mode
          - random
          - --ssl-certfile
          - /var/run/kserve/tls/tls.crt
          - --ssl-keyfile
          - /var/run/kserve/tls/tls.key
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef: { apiVersion: v1, fieldPath: metadata.name }
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef: { apiVersion: v1, fieldPath: metadata.namespace }
        ports:
          - name: https
            containerPort: 8000
            protocol: TCP
        livenessProbe:
          httpGet: { path: /health, port: https, scheme: HTTPS }
        readinessProbe:
          httpGet: { path: /ready, port: https, scheme: HTTPS }
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
