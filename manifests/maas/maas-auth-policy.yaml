# ORPHANED / NOT CURRENTLY APPLIED on the active sandbox (verified live via
# `oc get maasauthpolicy maas-demo-access -n models-as-a-service` ->
# NotFound). Same origin/caveat as manifests/maas/maas-subscription.yaml --
# do NOT apply this on a new sandbox. Real governance is
# manifests/demo2/11-maas-authpolicy.yaml.
#
# Authorization policy: grants API-gateway access to the demo simulator for
# the same group as the subscription. Per official docs, BOTH a subscription
# (quota) AND an authorization policy (gateway access) are required -- a
# subscription alone still returns 403. `make demo-auth` deletes and restores
# exactly this object to demonstrate that behavior.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: maas-demo-access
  namespace: models-as-a-service
  labels:
    app.kubernetes.io/part-of: rhoai-maas-demo
  annotations:
    openshift.io/display-name: "MaaS Demo Access"
    openshift.io/description: "Grants all authenticated users API gateway access to the demo simulator."
spec:
  modelRefs:
    - name: demo-simulator
      namespace: rhoai-maas-demo
  subjects:
    groups:
      - name: system:authenticated
    users: []
