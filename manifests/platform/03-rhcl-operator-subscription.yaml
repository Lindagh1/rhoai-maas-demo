# Red Hat Connectivity Link (RHCL) operator subscription.
# Installs the Kuadrant operator (which in turn manages Authorino + Limitador)
# into the shared openshift-operators namespace, matching the official RHOAI
# 3.5 MaaS prerequisite: "Red Hat Connectivity Link Operator version 1.4.x".
#
# NOTE: this is the Demo 1 copy, consumed by scripts/10-prerequisites.sh.
# A second copy exists at manifests/rhoai-operator/05-rhcl-operator-subscription.yaml
# for the unrelated install-rhoai-operator.sh flow — keep both in sync.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhcl-operator
  namespace: openshift-operators
  labels:
    app.kubernetes.io/part-of: rhoai-maas-demo
spec:
  # Prefer stable-1.4 (CSV 1.4.4 on this catalog) over plain "stable" (1.4.3).
  # Official RHOAI 3.5 MaaS docs require RHCL Operator 1.4.x.
  channel: stable-1.4
  name: rhcl-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
