# Publishes the demo model to Models-as-a-Service. This is the CR that
# the RHOAI dashboard's "Publish as MaaS" checkbox creates for you; here it's
# declarative/GitOps. Lives in the model's own namespace (per official docs
# CLI reference: "Publish a model by creating a MaaSModelRef resource that
# references your deployed inference server").
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: demo-llm
  namespace: maas-demo
  labels:
    app.kubernetes.io/part-of: maas-demo
  annotations:
    openshift.io/display-name: "Simulation CPU - répétition MaaS"
    openshift.io/description: "Réponses synthétiques : répétition des mécanismes MaaS sans inférence GPU réelle."
spec:
  modelRef:
    kind: LLMInferenceService
    name: demo-llm
