# Gouverner — RBAC so demo-user can see demo-llm in the RHOAI dashboard
# (Gen AI studio -> AI asset endpoints -> Models tab, and the Playground).
#
# ROOT CAUSE (discovered live on this sandbox, confirmed via dashboard backend
# logs in redhat-ods-applications/rhods-dashboard):
#   GET /gen-ai/api/v1/maas/models?namespace=maas-demo  -> 403
#   GET /gen-ai/api/v1/aaa/models?namespace=maas-demo   -> 403
# The dashboard BFF issues a CLUSTER-WIDE list on llminferenceservices.serving.kserve.io
# (not namespace-scoped) to discover models, using the caller's own token.
# A plain namespace `view`/`admin` RoleBinding in maas-demo is NOT enough —
# confirmed via:
#   oc auth can-i list llminferenceservices --all-namespaces --as=demo-user  # -> no (before this fix)
# Granting a ClusterRole bound via ClusterRoleBinding fixes it:
#   oc auth can-i list llminferenceservices --all-namespaces --as=demo-user  # -> yes (after)
#
# Project-level view access (so the project even shows up in the Project dropdown
# on AI asset endpoints) is granted separately as a namespace RoleBinding below.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: demo-llm-viewer
  labels:
    app.kubernetes.io/part-of: maas-demo
rules:
  - apiGroups: ["serving.kserve.io"]
    resources: ["llminferenceservices"]
    verbs: ["get", "list", "watch"]
  # Confirmed live via a real browser-session 403 body:
  #   {"error":{"code":"403","message":"user does not have permission to
  #   access services in this namespace"}}
  # Same cluster-wide-list pattern as llminferenceservices above:
  #   oc auth can-i list services --all-namespaces --as=demo-user  # -> no (before)
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: demo-user-llm-viewer
  labels:
    app.kubernetes.io/part-of: maas-demo
subjects:
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: demo-user
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: demo-llm-viewer
---
# Project-level access so maas-demo appears in the dashboard's Project
# selector for this non-admin user (admin ClusterRole = can view + use Playground).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-user-project-admin
  namespace: maas-demo
  labels:
    app.kubernetes.io/part-of: maas-demo
subjects:
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: demo-user
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
