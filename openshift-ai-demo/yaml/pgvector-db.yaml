apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgvector-db-data
  namespace: knowledge-advisor
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
  storageClassName: gp3-csi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgvector-db
  namespace: knowledge-advisor
  labels: {app: pgvector-db}
spec:
  replicas: 1
  selector:
    matchLabels: {app: pgvector-db}
  template:
    metadata:
      labels: {app: pgvector-db}
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-16:latest
          # pgvector extension is not in the base RHEL postgres image; overridden by init step below
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef: {name: pgvector-db-credentials}
          env:
            - {name: POSTGRESQL_USER, valueFrom: {secretKeyRef: {name: pgvector-db-credentials, key: POSTGRES_USER}}}
            - {name: POSTGRESQL_PASSWORD, valueFrom: {secretKeyRef: {name: pgvector-db-credentials, key: POSTGRES_PASSWORD}}}
            - {name: POSTGRESQL_DATABASE, valueFrom: {secretKeyRef: {name: pgvector-db-credentials, key: POSTGRES_DB}}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/pgsql/data}
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "1", memory: "1Gi"}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "ragadmin"]}
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: pgvector-db-data}
---
apiVersion: v1
kind: Service
metadata:
  name: pgvector-db
  namespace: knowledge-advisor
  labels: {app: pgvector-db}
spec:
  selector: {app: pgvector-db}
  ports:
    - {port: 5432, targetPort: 5432, name: postgres}
