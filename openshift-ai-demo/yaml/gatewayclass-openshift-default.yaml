# Required by Red Hat Connectivity Link on OpenShift 4.19+ per official docs:
# "you must create a GatewayClass named openshift-default and specify a
#  controllerName of openshift.io/gateway-controller/v1"
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: openshift-default
spec:
  controllerName: openshift.io/gateway-controller/v1
