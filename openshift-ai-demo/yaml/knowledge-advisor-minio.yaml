# MinIO — S3-compatible object storage for knowledge-advisor
# Backs: (1) the "company-documents" Connection (bucket: documents)
#        (2) the Data Science Pipelines server's required object storage (bucket: pipelines)
#
# SECURITY: this is a reference/template manifest kept for historical documentation.
# Do NOT `oc apply` this Secret as-is. Generate the password at apply time instead, e.g.:
#   oc create secret generic minio-credentials -n knowledge-advisor \
#     --from-literal=MINIO_ROOT_USER=minioadmin \
#     --from-literal=MINIO_ROOT_PASSWORD="$(python3 -c 'import secrets;print(secrets.token_hex(20))')"
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: knowledge-advisor
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: CHANGE_ME_GENERATE_RANDOM_PASSWORD
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: knowledge-advisor
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
  storageClassName: gp3-csi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: knowledge-advisor
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom:
            - secretRef:
                name: minio-credentials
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: knowledge-advisor
  labels:
    app: minio
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
# One-shot Job that creates the two required buckets using the mc client
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-buckets
  namespace: knowledge-advisor
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mc
          image: quay.io/minio/mc:latest
          envFrom:
            - secretRef:
                name: minio-credentials
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: HOME
              value: /tmp
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p /tmp/.mc
              until mc --config-dir /tmp/.mc alias set local http://minio.knowledge-advisor.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "waiting for minio..."; sleep 3
              done
              mc --config-dir /tmp/.mc mb -p local/documents
              mc --config-dir /tmp/.mc mb -p local/pipelines
              mc --config-dir /tmp/.mc ls local
