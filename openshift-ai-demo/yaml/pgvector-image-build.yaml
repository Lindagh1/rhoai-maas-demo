apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: pgvector-postgresql-16
  namespace: knowledge-advisor
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: pgvector-postgresql-16
  namespace: knowledge-advisor
spec:
  source:
    type: Dockerfile
    dockerfile: |
      FROM registry.redhat.io/rhel9/postgresql-16:latest
      USER 0
      RUN dnf install -y git make gcc redhat-rpm-config postgresql-server-devel && \
          git clone --branch v0.7.4 --depth 1 https://github.com/pgvector/pgvector.git /tmp/pgvector && \
          cd /tmp/pgvector && \
          make OPTFLAGS="" PG_CONFIG=/usr/bin/pg_config && \
          make install PG_CONFIG=/usr/bin/pg_config && \
          rm -rf /tmp/pgvector && \
          dnf remove -y git make gcc redhat-rpm-config postgresql-server-devel && \
          dnf clean all
      USER 26
  strategy:
    type: Docker
    dockerStrategy: {}
  output:
    to: {kind: ImageStreamTag, name: "pgvector-postgresql-16:latest"}
