# Workbench (Notebook CR) for knowledge-advisor
# Image: Jupyter | Data Science | CPU | Python 3.12 (RHOAI 3.5 default workbench image)
# Connections attached: vector-database (URI), company-documents (S3)
# Hardware profile: default-profile (2 CPU / 4Gi, no accelerator)
# The odh-notebook-controller mutating webhook auto-injects the oauth-proxy sidecar,
# Service, Route, and ServiceAccount on creation — matching exactly what the dashboard does.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: knowledge-advisor-workbench
  namespace: knowledge-advisor
  labels:
    opendatahub.io/dashboard: "true"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
  storageClassName: gp3-csi
---
apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: knowledge-advisor-workbench
  namespace: knowledge-advisor
  labels:
    opendatahub.io/dashboard: "true"
    app: knowledge-advisor-workbench
  annotations:
    notebooks.opendatahub.io/inject-oauth: "true"
    opendatahub.io/hardware-profile-name: default-profile
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    opendatahub.io/connections: "knowledge-advisor/vector-database,knowledge-advisor/company-documents"
    openshift.io/display-name: "Knowledge Advisor Workbench"
    openshift.io/description: "Maya's JupyterLab environment for the Knowledge Advisor RAG application."
    notebooks.opendatahub.io/last-image-selection: "s2i-generic-data-science-notebook:3.5"
spec:
  template:
    spec:
      affinity: {}
      enableServiceLinks: false
      serviceAccountName: knowledge-advisor-workbench
      containers:
        - name: knowledge-advisor-workbench
          image: "image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-generic-data-science-notebook:3.5"
          imagePullPolicy: Always
          workingDir: /opt/app-root/src
          env:
            - name: NOTEBOOK_ARGS
              value: |
                --ServerApp.port=8888
                --ServerApp.token=''
                --ServerApp.password=''
                --ServerApp.base_url=/notebook/knowledge-advisor/knowledge-advisor-workbench
                --ServerApp.quit_button=False
            - name: JUPYTER_IMAGE
              value: "image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-generic-data-science-notebook:3.5"
            - name: MLFLOW_TRACKING_URI
              value: "https://mlflow.redhat-ods-applications.svc.cluster.local:8443"
          envFrom:
            - secretRef:
                name: vector-database
            - secretRef:
                name: company-documents
          ports:
            - containerPort: 8888
              name: notebook-port
              protocol: TCP
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - mountPath: /opt/app-root/src
              name: knowledge-advisor-workbench
            - mountPath: /dev/shm
              name: shm
        - name: oauth-proxy
          image: image-registry.openshift-image-registry.svc:5000/openshift/oauth-proxy:v4.4
          imagePullPolicy: Always
          ports:
            - containerPort: 8443
              name: oauth-proxy
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          args:
            - --provider=openshift
            - --https-address=:8443
            - --http-address=
            - --openshift-service-account=knowledge-advisor-workbench
            - --cookie-secret-file=/etc/oauth/config/cookie_secret
            - --cookie-expire=24h0m0s
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --upstream=http://localhost:8888
            - --upstream-ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - --email-domain=*
            - --skip-provider-button
            - '--openshift-sar={"verb":"get","resource":"notebooks","resourceAPIGroup":"kubeflow.org","resourceName":"knowledge-advisor-workbench","namespace":"$(NAMESPACE)"}'
            - --logout-url=/
          volumeMounts:
            - mountPath: /etc/oauth/config
              name: oauth-config
            - mountPath: /etc/tls/private
              name: tls-certificates
      volumes:
        - name: knowledge-advisor-workbench
          persistentVolumeClaim:
            claimName: knowledge-advisor-workbench
        - name: shm
          emptyDir:
            medium: Memory
        - name: oauth-config
          secret:
            defaultMode: 420
            secretName: knowledge-advisor-workbench-oauth-config
        - name: tls-certificates
          secret:
            defaultMode: 420
            secretName: knowledge-advisor-workbench-tls
