# Wires facebook-opt-125m-cpu (llm namespace) into the Models-as-a-Service tenant.
#
# NAMESPACE CORRECTION (see ENABLED-FEATURES.md for full note):
# The upstream opendatahub-io/models-as-a-service sample docs show MaaSModelRef with a
# spec.modelRef.namespace field pointing cross-namespace at the LLMInferenceService.
# `oc explain maasmodelref.spec.modelRef` on THIS cluster's installed CRD
# (maas.opendatahub.io/v1alpha1) only exposes `kind` and `name` - no `namespace` field.
# A first attempt with modelRef.namespace: llm from a MaaSModelRef in the
# "models-as-a-service" tenant namespace had the field silently pruned by the CRD's
# structural schema, and the controller then looked for the LLMInferenceService in the
# MaaSModelRef's OWN namespace and failed ("HTTPRoute not found ... in namespace
# models-as-a-service"). Fix: MaaSModelRef/MaaSAuthPolicy/MaaSSubscription must live in
# the SAME namespace as the LLMInferenceService they reference (here: llm). The
# `tenantRef` field (omitted here) is what assigns a model to an AITenant/tenant
# namespace like "models-as-a-service" - it is independent of physical namespace
# placement. Omitting it assigns the model to the default tenant, which is what we want.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: facebook-opt-125m-cpu
  namespace: llm
spec:
  modelRef:
    kind: LLMInferenceService
    name: facebook-opt-125m-cpu
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: facebook-opt-125m-cpu-access
  namespace: llm
spec:
  modelRefs:
    - name: facebook-opt-125m-cpu
      namespace: llm
  subjects:
    groups:
      - name: system:authenticated
    users: []
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: facebook-opt-125m-cpu-subscription
  namespace: llm
spec:
  owner:
    groups:
      - name: system:authenticated
    users: []
  modelRefs:
    - name: facebook-opt-125m-cpu
      namespace: llm
      tokenRateLimits:
        - limit: 100
          window: 1m
